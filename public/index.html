<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AniLAN</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <h1>AniLAN</h1>
      <form id="search-form">
        <label for="search-query">Search anime</label>
        <div class="search-row">
          <input id="search-query" name="q" type="search" maxlength="120" placeholder="Search anime..." required>
          <button type="submit">Search</button>
        </div>
      </form>
      <p id="search-status" role="status" aria-live="polite"></p>
      <section aria-labelledby="results-heading">
        <h2 id="results-heading">Search results</h2>
        <ul id="search-results"></ul>
      </section>
      <section id="episodes-panel" aria-labelledby="episodes-heading" hidden>
        <h2 id="episodes-heading">Episodes</h2>
        <ul id="episode-results"></ul>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
